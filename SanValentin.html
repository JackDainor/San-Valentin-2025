	 <style>

.contenido {
	position: relative;
	display: flex;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	width: 200%;
	height: 100vh;
	color: whitesmoke;
}

.text {
  width: 200px;
  height: 200px;
  background: red;
  position: relative;
  box-shadow: 10px 10px 90px #f20044;
  animation: animtext .6s linear infinite;
}

@keyframes animtext{
  0%{
    transform: rotate(-45deg) scale(1.07);
  }
  80%{
    transform: rotate(-45deg) scale(1);
  }
  100%{
    transform: rotate(-45deg) scale(.8);
  }
}

.text::before {
  content: '';
  position: absolute;
  width: 200px;
  height: 200px;
  background: red;
  box-shadow: -10px 10px 90px #f20044;
  top: -50%;
  border-radius: 50%;
}

.text::after {
  content: '';
  position: absolute;
  width: 200px;
  height: 200px;
  background: red;
  box-shadow: 10px -10px 90px #f20044;
  right: -50%;
  border-radius: 50%;
}

      margin: 2px;
      text-decoration: none;
      padding: 8px;
      margin-top: 30px;
      border-radius: 20%;
      font-size: 30px;
      color: whitesmoke;
    }
    
  </style>
